plugins { id 'com.android.application' }

android {
    namespace 'com.example.contactmasksafe'
    compileSdk 36

    defaultConfig {
        applicationId 'com.example.contactmasksafe'
        minSdk 22
        targetSdk 36
        versionCode 8
        versionName '3.1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildTypes {
        release { minifyEnabled false }
    }
}
