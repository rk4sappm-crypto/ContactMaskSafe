name: Build Makoo APK

on:
  workflow_dispatch:
  push:
    branches: [ makoo-brand-scrollsafe ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Apply proven ScrollSafe 3.1.2 engine
        run: git apply .github/scrollsafe-v3.1.2.patch

      - name: Apply Makoo branding
        run: python3 tools/apply_makoo_brand.py

      - name: Apply Makoo 3.3 Protected Contact Screen
        run: python3 tools/apply_makoo_v3_3_protected.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 16 SDK
        run: |
          sdkmanager "platforms;android-36" "build-tools;35.0.0" "platform-tools"
          yes | sdkmanager --licenses

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build Makoo direct-install APK
        run: gradle assembleDebug

      - name: Prepare Makoo APK and exact source
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Makoo-3.3.0-ProtectedContact-PasswordProtected.apk
          zip -qr dist/Makoo-3.3.0-ProtectedContact-Source.zip . -x '.git/*' 'dist/*' '.gradle/*' 'app/build/*'
          (cd dist && sha256sum Makoo-3.3.0-ProtectedContact-PasswordProtected.apk Makoo-3.3.0-ProtectedContact-Source.zip > SHA256SUMS.txt)

      - name: Upload Makoo package
        uses: actions/upload-artifact@v4
        with:
          name: Makoo-3.3.0-ProtectedContact-APK-and-Source
          path: dist/
