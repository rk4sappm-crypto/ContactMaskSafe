name: Build Makoo Universal APKs

on:
  workflow_dispatch:
  push:
    branches: [ makoo-brand-scrollsafe ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: NonVivo
            vivo: 'false'
            apk_name: Makoo-3.4.0-UniversalApps-NonVivo.apk
            source_name: Makoo-3.4.0-UniversalApps-NonVivo-Source.zip
            artifact_name: Makoo-3.4.0-UniversalApps-NonVivo
          - variant: VivoPersistent
            vivo: 'true'
            apk_name: Makoo-3.4.0-UniversalApps-VivoPersistent.apk
            source_name: Makoo-3.4.0-UniversalApps-VivoPersistent-Source.zip
            artifact_name: Makoo-3.4.0-UniversalApps-VivoPersistent

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Apply proven ScrollSafe 3.1.2 engine
        run: git apply .github/scrollsafe-v3.1.2.patch

      - name: Apply Makoo branding
        run: python3 tools/apply_makoo_brand.py

      - name: Apply Makoo Protected Contact Screen
        run: python3 tools/apply_makoo_v3_3_protected.py

      - name: Apply Makoo CopySafe protection
        run: python3 tools/apply_makoo_v3_3_1_copysafe.py

      - name: Apply Vivo compatibility
        if: matrix.vivo == 'true'
        run: python3 tools/apply_makoo_v3_3_2_vivofix.py

      - name: Apply persistent Vivo protection
        if: matrix.vivo == 'true'
        run: python3 tools/apply_makoo_v3_3_3_persistent_vivo.py

      - name: Apply Makoo 3.4 Universal App Protection
        run: python3 tools/apply_makoo_v3_4_universal_apps.py .

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 16 SDK
        run: |
          sdkmanager "platforms;android-36" "build-tools;35.0.0" "platform-tools"
          yes | sdkmanager --licenses

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build Makoo direct-install APK
        run: gradle assembleDebug

      - name: Prepare APK and exact source
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/${{ matrix.apk_name }}"
          zip -qr "dist/${{ matrix.source_name }}" . -x '.git/*' 'dist/*' '.gradle/*' 'app/build/*'
          (cd dist && sha256sum "${{ matrix.apk_name }}" "${{ matrix.source_name }}" > SHA256SUMS.txt)

      - name: Upload Makoo package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/
