name: Build Makoo Kids Languages v2.1 APK

on:
  push:
    branches: [ makoo-kids-languages-build ]
    paths:
      - 'v21build/**'
      - '.github/workflows/makoo-kids-languages-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Assemble upgraded v2.1 source
        run: |
          set -e
          SRC="makoo-kids-languages/app/src/main/java/org/ucpl/makookidslanguages/MainActivity.kt"
          mkdir -p "$(dirname "$SRC")"
          cat v2build/MainActivity.part00 v2build/MainActivity.part01 v2build/MainActivity.part02 v2build/MainActivity.part03 v2build/MainActivity.part04 > "$SRC"
          cat v21build/main.patch.part00 v21build/main.patch.part01 > /tmp/v21.patch
          patch "$SRC" < /tmp/v21.patch

          mkdir -p makoo-kids-languages/app/src/main/res/drawable-nodpi
          base64 -d v2build/makoo_logo.b64 > makoo-kids-languages/app/src/main/res/drawable-nodpi/makoo_logo.png

          cat > makoo-kids-languages/app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "org.ucpl.makookidslanguages"
              compileSdk = 35

              defaultConfig {
                  applicationId = "org.ucpl.makookidslanguages"
                  minSdk = 23
                  targetSdk = 35
                  versionCode = 3
                  versionName = "2.1.0"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }

          kotlin {
              jvmToolchain(17)
          }
          EOF

          cat > makoo-kids-languages/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:theme="@style/AppTheme"
                  android:label="Makoo Kids Languages"
                  android:icon="@drawable/makoo_logo"
                  android:roundIcon="@drawable/makoo_logo"
                  android:allowBackup="true"
                  android:supportsRtl="true">
                  <activity android:name=".MainActivity" android:screenOrientation="portrait" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > makoo-kids-languages/app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#FF7A00</item>
                  <item name="android:navigationBarColor">#FFF8F0</item>
                  <item name="android:statusBarColor">#082A5E</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:windowActionModeOverlay">true</item>
              </style>
          </resources>
          EOF

          echo "Reconstructed MainActivity lines: $(wc -l < "$SRC")"
          grep -n "Flashcards\|Listening Challenge\|Achievements\|updateAdventureSelection" "$SRC"
          file makoo-kids-languages/app/src/main/res/drawable-nodpi/makoo_logo.png

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: makoo-kids-languages
        run: gradle assembleDebug

      - name: Verify and prepare APK
        run: |
          set -e
          mkdir -p dist
          cp makoo-kids-languages/app/build/outputs/apk/debug/app-debug.apk dist/Makoo_Kids_Languages_v2.1.0.apk
          unzip -t dist/Makoo_Kids_Languages_v2.1.0.apk >/dev/null
          sha256sum dist/Makoo_Kids_Languages_v2.1.0.apk > dist/Makoo_Kids_Languages_v2.1.0_SHA256.txt
          ls -lh dist/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Makoo-Kids-Languages-v2.1-APK
          path: dist/
