name: Build Makoo Kids v3 APK

on:
  push:
    branches: [ makoo-kids-languages-build ]
    paths:
      - 'v3build/**'
      - '.github/workflows/makoo-kids-languages-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Reconstruct and verify Makoo Kids v3 source
        run: |
          set -euo pipefail
          cat \
            v3build/src.part00 \
            v3build/src.part01 \
            v3build/src.part02.s00 v3build/src.part02.s01 v3build/src.part02.s02 v3build/src.part02.s03 v3build/src.part02.s04 v3build/src.part02.s05 v3build/src.part02.s06 \
            v3build/src.part03 \
            v3build/src.part04 \
            v3build/src.part05 \
            v3build/src.part06 \
            v3build/src.part07.s00 v3build/src.part07.s01 v3build/src.part07.s02 v3build/src.part07.s03 v3build/src.part07.s04 v3build/src.part07.s05 v3build/src.part07.s06 \
            v3build/src.part08 > /tmp/makoo-source.b64
          test "$(wc -c < /tmp/makoo-source.b64)" = "118984"
          echo "a03b90a2194846d7a4bec6bbb9d3a38ab680c0b28b178949ed5324d5bbe2bf4b  /tmp/makoo-source.b64" | sha256sum -c -
          base64 -d /tmp/makoo-source.b64 > /tmp/makoo-source.tar.xz
          echo "3796c86b04cb353cb0fe157bb34d92944bf885f2a4581909a2c6f833e3f980dd  /tmp/makoo-source.tar.xz" | sha256sum -c -
          xz -t /tmp/makoo-source.tar.xz
          tar -xJf /tmp/makoo-source.tar.xz
          mkdir -p Makoo_Kids_v3.0.0_Source/app/src/main/res/drawable-nodpi
          base64 -d v2build/makoo_logo.b64 > Makoo_Kids_v3.0.0_Source/app/src/main/res/drawable-nodpi/makoo_logo.png

          python - <<'PY'
          from pathlib import Path
          p = Path('Makoo_Kids_v3.0.0_Source/app/src/main/java/org/ucpl/makookidslanguages/VoiceAssistantService.kt')
          s = p.read_text()
          old = '''        try {\n            recognizer?.destroy()\n            recognizer = SpeechRecognizer.createSpeechRecognizer(this)\n            recognizer?.setRecognitionListener(object : RecognitionListener {'''
          new = '''        try {\n            recognizer?.destroy()\n            val speechRecognizer = SpeechRecognizer.createSpeechRecognizer(this)\n            recognizer = speechRecognizer\n            speechRecognizer.setRecognitionListener(object : RecognitionListener {'''
          assert old in s, 'voice recognizer creation pattern not found'
          s = s.replace(old, new, 1)
          old2 = '''            recognizer?.startListening(Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH).apply {'''
          new2 = '''            speechRecognizer.startListening(Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH).apply {'''
          assert old2 in s, 'voice startListening pattern not found'
          s = s.replace(old2, new2, 1)
          p.write_text(s)
          PY

          grep -q 'class VoiceAssistantService' Makoo_Kids_v3.0.0_Source/app/src/main/java/org/ucpl/makookidslanguages/VoiceAssistantService.kt
          grep -q 'val speechRecognizer = SpeechRecognizer.createSpeechRecognizer' Makoo_Kids_v3.0.0_Source/app/src/main/java/org/ucpl/makookidslanguages/VoiceAssistantService.kt
          grep -q 'Makoo Kids' Makoo_Kids_v3.0.0_Source/app/src/main/java/org/ucpl/makookidslanguages/MainActivity.kt
          grep -q 'Designed and Developed in India by UCPL Technologies' Makoo_Kids_v3.0.0_Source/app/src/main/java/org/ucpl/makookidslanguages/MainActivity.kt
          python - <<'PY'
          import json
          base='Makoo_Kids_v3.0.0_Source/app/src/main/assets'
          expected={'subjects':18,'stories':200,'songs':200}
          for f,n in expected.items():
              with open(f'{base}/{f}.json', encoding='utf-8') as h:
                  data=json.load(h)
              print(f, len(data))
              assert len(data)==n, (f, len(data), n)
          PY
          file Makoo_Kids_v3.0.0_Source/app/src/main/res/drawable-nodpi/makoo_logo.png

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: Makoo_Kids_v3.0.0_Source
        run: gradle assembleDebug

      - name: Verify and prepare APK
        run: |
          set -euo pipefail
          mkdir -p dist
          cp Makoo_Kids_v3.0.0_Source/app/build/outputs/apk/debug/app-debug.apk dist/Makoo_Kids_v3.0.0.apk
          unzip -t dist/Makoo_Kids_v3.0.0.apk >/dev/null
          sha256sum dist/Makoo_Kids_v3.0.0.apk > dist/Makoo_Kids_v3.0.0_SHA256.txt
          ls -lh dist/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Makoo-Kids-v3-APK
          path: dist/
