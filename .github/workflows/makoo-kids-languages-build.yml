name: Build Makoo Kids Languages APK

on:
  push:
    branches: [ makoo-kids-languages-build ]
    paths:
      - 'makoo-kids-languages/**'
      - '.github/workflows/makoo-kids-languages-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: makoo-kids-languages
        run: gradle assembleDebug

      - name: Prepare APK
        run: |
          mkdir -p dist
          cp makoo-kids-languages/app/build/outputs/apk/debug/app-debug.apk dist/Makoo_Kids_Languages_v1.0.0.apk
          sha256sum dist/Makoo_Kids_Languages_v1.0.0.apk > dist/SHA256SUMS.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Makoo-Kids-Languages-APK
          path: dist/
