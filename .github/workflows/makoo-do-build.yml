name: Build Makoo Do APK

on:
  push:
    branches: [ makoo-do-build ]
    paths:
      - 'Makoo_Do_v1.0.0_Source/**'
      - '.github/workflows/makoo-do-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Restore and verify Makoo logo and source
        run: |
          set -euo pipefail
          mkdir -p Makoo_Do_v1.0.0_Source/app/src/main/res/drawable-nodpi
          curl -fsSL "https://raw.githubusercontent.com/rk4sappm-crypto/ContactMaskSafe/makoo-spoken-languages-build/v2build/makoo_logo.b64" -o /tmp/makoo_logo.b64
          base64 -d /tmp/makoo_logo.b64 > Makoo_Do_v1.0.0_Source/app/src/main/res/drawable-nodpi/makoo_logo.png
          file Makoo_Do_v1.0.0_Source/app/src/main/res/drawable-nodpi/makoo_logo.png
          grep -q 'Makoo Do' Makoo_Do_v1.0.0_Source/app/src/main/java/org/ucpl/makoodo/MainActivity.kt
          grep -q 'Designed and Developed in India by UCPL Technologies' Makoo_Do_v1.0.0_Source/app/src/main/java/org/ucpl/makoodo/MainActivity.kt
          grep -q 'class VoiceAssistantService' Makoo_Do_v1.0.0_Source/app/src/main/java/org/ucpl/makoodo/VoiceAssistantService.kt
          grep -q 'Hey Makoo' Makoo_Do_v1.0.0_Source/app/src/main/java/org/ucpl/makoodo/VoiceAssistantService.kt
          grep -q 'customShortcut' Makoo_Do_v1.0.0_Source/app/src/main/java/org/ucpl/makoodo/AssistantCore.kt

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: Makoo_Do_v1.0.0_Source
        run: gradle assembleDebug

      - name: Verify and prepare APK
        run: |
          set -euo pipefail
          mkdir -p dist
          cp Makoo_Do_v1.0.0_Source/app/build/outputs/apk/debug/app-debug.apk dist/Makoo_Do_v1.0.0.apk
          unzip -t dist/Makoo_Do_v1.0.0.apk >/dev/null
          sha256sum dist/Makoo_Do_v1.0.0.apk > dist/Makoo_Do_v1.0.0_SHA256.txt
          ls -lh dist/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Makoo-Do-v1-APK
          path: dist/
