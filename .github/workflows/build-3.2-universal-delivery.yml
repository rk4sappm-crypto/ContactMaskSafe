name: Build and Deliver ContactMask Safe 3.2 Universal

on:
  workflow_dispatch:
  push:
    branches: [ contactmasksafe-v3.1-one-tap ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
      - name: Apply Universal 3.2 setup patch
        run: python3 tools/apply_universal_3_2_final.py
      - name: Install Universal 3.2 masking engine
        run: cp tools/PrivacyAccessibilityService_3_2.java.txt app/src/main/java/com/example/contactmasksafe/PrivacyAccessibilityService.java
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: |
          sdkmanager "platforms;android-36" "build-tools;35.0.0" "platform-tools"
          yes | sdkmanager --licenses
      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build universal installable APK
        run: gradle assembleDebug
      - name: Package APK and patched source
        run: |
          rm -rf dist
          mkdir -p dist source-package
          cp app/build/outputs/apk/debug/app-debug.apk dist/ContactMaskSafe-3.2.0-Universal-EasySetup.apk
          sha256sum dist/ContactMaskSafe-3.2.0-Universal-EasySetup.apk > dist/ContactMaskSafe-3.2.0-Universal-EasySetup-SHA256.txt
          rsync -a --exclude '.git' --exclude '.gradle' --exclude 'build' --exclude 'dist' --exclude 'source-package' ./ source-package/
          (cd source-package && zip -qr ../dist/ContactMaskSafe-3.2.0-Universal-EasySetup-Source.zip .)
          sha256sum dist/ContactMaskSafe-3.2.0-Universal-EasySetup-Source.zip > dist/ContactMaskSafe-3.2.0-Universal-EasySetup-Source-SHA256.txt
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ContactMaskSafe-3.2.0-universal-delivery
          path: dist/
      - name: Publish build files to work branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dist/ContactMaskSafe-3.2.0-Universal-EasySetup.apk dist/ContactMaskSafe-3.2.0-Universal-EasySetup-SHA256.txt dist/ContactMaskSafe-3.2.0-Universal-EasySetup-Source.zip dist/ContactMaskSafe-3.2.0-Universal-EasySetup-Source-SHA256.txt
          if git diff --cached --quiet; then
            echo "Build files already current"
          else
            git commit -m "Add ContactMask Safe 3.2 Universal build [skip ci]"
            git push origin HEAD:contactmasksafe-v3.1-one-tap
          fi
